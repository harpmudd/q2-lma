name: Release
# A tag q2-vX.Y must match cmd/q2-lma/main.go's version and have a CHANGELOG.md section. It runs the
# checks, builds the card files and publishes them as the release's only ZIP, with that section as
# the release notes. (Q2 Pod's App Store installs a release's first ZIP, once sources.list lists
# the app; it doesn't yet.)
on:
  push:
    tags: ['q2-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and changelog
        run: |
          want=$(sed -n 's/^\tversion *= "\(q2-v[0-9.]*\)"$/\1/p' cmd/q2-lma/main.go)
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but main.go's version is $want"; exit 1; }
          v=${GITHUB_REF_NAME#q2-v}
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md # text, not regex: awks differ on \[
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section ## [$v]"; exit 1; }
          printf '\n---\n**Install:** with the Q2 powered off, unzip the zip below at the root of its card.\n' >> notes.md
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - name: Test
        run: |
          go vet ./...
          go test ./...
          python3 contrib/shanlingq2/test_launcher.py
      - name: Build
        run: contrib/shanlingq2/build.sh target/shanlingq2
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" target/shanlingq2/q2-lma-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/shanlingq2/q2-lma-*.zip \
              --title "q2-lma ${GITHUB_REF_NAME#q2-}" --notes-file notes.md
          fi
