name: CI
# Every push and pull request: vet, gofmt, the tests (with the race detector), the launcher test and
# the Q2 build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27' # a supported release, with its security fixes; go.mod's is the minimum
          check-latest: true
      - name: Vet and format
        run: |
          go vet ./...
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::gofmt -w these files:"; echo "$unformatted"; exit 1; }
      - name: Test
        run: |
          go test -race ./...
          python3 contrib/shanlingq2/test_launcher.py
      - name: Build
        run: contrib/shanlingq2/build.sh target/shanlingq2
